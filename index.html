<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HABIB Fitness Lifestyle</title>
<style>
body{margin:0;background:#0b0b0b;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:25px;border-bottom:1px solid #d4af37}
.logo{font-size:30px;font-weight:bold;color:#d4af37}
.hero{padding:100px 20px}

p{color:#ccc;font-size:17px}
.button{display:inline-block;background:#d4af37;color:#111;padding:14px 28px;border-radius:6px;text-decoration:none;font-weight:bold}
.products{padding:40px 20px}
.card{background:#151515;margin:20px auto;padding:25px;border-radius:10px;max-width:350px}
.price{color:#d4af37;font-size:20px;margin:15px}

<a class="button" href="#products">مشاهده محصولات</a>
</section>

<section class="products" id="products">
<h2 class="gold">محصولات منتخب</h2>

<div class="card">
<h3>کراتین مونوهیدرات</h3>

<div class="price">قیمت محصول</div>
<a class="button" href="#">مشاهده</a>
</div>

<div class="card">
<h3>پروتئین وی</h3>
<p>پروتئین باکیفیت برای رشد عضلات</p>
<div class="price">قیمت محصول</div>
<a class="button" href="#">مشاهده</a>
</div>

</section>

<footer>
© 2026 HABIB Fitness Lifestyle
</footer>

</html>
