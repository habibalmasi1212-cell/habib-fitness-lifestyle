<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HABIB Fitness Lifestyle</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#080808;
color:#fff;
line-height:1.8;
}

a{
text-decoration:none;
}

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(8,8,8,.95);
border-bottom:1px solid #2b2b2b;
padding:16px 20px;
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:27px;
font-weight:bold;
color:#d4af37;
letter-spacing:2px;
}

.menu{
display:flex;
gap:22px;
}

.menu a{
color:#ddd;
font-size:14px;
}

.menu a:hover{
color:#d4af37;
}

.hero{
min-height:620px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:80px 20px;
background:
radial-gradient(circle at center,#242424 0%,#111 35%,#080808 75%);
}

.hero-content{
max-width:800px;
}

.badge{
display:inline-block;
border:1px solid #d4af37;
color:#d4af37;
padding:7px 18px;
border-radius:30px;
font-size:13px;
margin-bottom:22px;
}

.hero h1{
font-size:48px;
line-height:1.3;
margin-bottom:20px;
}

.gold{
color:#d4af37;
}

.hero p{
font-size:18px;
color:#c8c8c8;
max-width:650px;
margin:0 auto 32px;
}

.btn{
display:inline-block;
background:#d4af37;
color:#080808;
padding:13px 30px;
border-radius:7px;
font-weight:bold;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
}

.section{
max-width:1100px;
margin:auto;
padding:70px 20px;
}

.section-title{
text-align:center;
margin-bottom:40px;
}
